# ─── ArgoCD Notifications for Microsoft Teams ────────────────────────────────
# Configures the built-in ArgoCD Notifications controller to send real-time
# GitOps deployment alerts to a Microsoft Teams channel via Webhook.
#
# Events covered:
#   1. on-sync-succeeded  : Green card when GitOps syncs new manifests successfully
#   2. on-sync-failed     : Orange/Red card if YAML is invalid or sync fails
#   3. on-health-degraded : Red card if pods enter CrashLoopBackOff or fail probes
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # ── Service Definition: MS Teams Webhook ──────────────────────────────────
  # The webhook URL is stored in the argocd-notifications-secret Secret
  service.webhook.msteams: |
    url: $msteams-webhook-url
    headers:
      - name: Content-Type
        value: application/json

  # ── Trigger: Sync Succeeded ───────────────────────────────────────────────
  trigger.on-sync-succeeded: |
    - description: Application syncing has succeeded
      send:
        - app-sync-succeeded
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']

  # ── Trigger: Sync Failed ──────────────────────────────────────────────────
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send:
        - app-sync-failed
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']

  # ── Trigger: Health Degraded (CrashLoop, OOM, failing probes) ─────────────
  trigger.on-health-degraded: |
    - description: Application health status is degraded
      send:
        - app-health-degraded
      when: app.status.health.status == 'Degraded'

  # ── Template: Sync Succeeded (Green Card) ─────────────────────────────────
  template.app-sync-succeeded: |
    webhook:
      msteams:
        method: POST
        body: |
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "107C10",
            "summary": "ArgoCD Sync Succeeded - {{.app.metadata.name}}",
            "sections": [{
              "activityTitle": "🔄 ArgoCD GitOps Sync Succeeded — {{.app.metadata.name}}",
              "activitySubtitle": "Namespace: {{.app.spec.destination.namespace}} | Cluster: in-cluster",
              "facts": [
                { "name": "Application", "value": "{{.app.metadata.name}}" },
                { "name": "Status", "value": "Synced & Healthy ✅" },
                { "name": "Repository", "value": "{{.app.spec.source.repoURL}}" },
                { "name": "Revision", "value": "{{.app.status.sync.revision}}" }
              ],
              "markdown": true
            }],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Open ArgoCD",
                "targets": [{ "os": "default", "uri": "https://localhost:8080/applications/{{.app.metadata.name}}" }]
              }
            ]
          }

  # ── Template: Sync Failed (Orange Card) ───────────────────────────────────
  template.app-sync-failed: |
    webhook:
      msteams:
        method: POST
        body: |
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "D83B01",
            "summary": "ArgoCD Sync Failed - {{.app.metadata.name}}",
            "sections": [{
              "activityTitle": "❌ ArgoCD GitOps Sync Failed — {{.app.metadata.name}}",
              "activitySubtitle": "Namespace: {{.app.spec.destination.namespace}}",
              "facts": [
                { "name": "Application", "value": "{{.app.metadata.name}}" },
                { "name": "Status", "value": "Sync Failed ❌" },
                { "name": "Message", "value": "{{.app.status.operationState.message}}" },
                { "name": "Revision", "value": "{{.app.status.sync.revision}}" }
              ],
              "markdown": true
            }],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Open ArgoCD",
                "targets": [{ "os": "default", "uri": "https://localhost:8080/applications/{{.app.metadata.name}}" }]
              }
            ]
          }

  # ── Template: Health Degraded (Red Card) ──────────────────────────────────
  template.app-health-degraded: |
    webhook:
      msteams:
        method: POST
        body: |
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "themeColor": "E81123",
            "summary": "ArgoCD Health Degraded - {{.app.metadata.name}}",
            "sections": [{
              "activityTitle": "⚠️ ArgoCD Application Degraded — {{.app.metadata.name}}",
              "activitySubtitle": "Namespace: {{.app.spec.destination.namespace}}",
              "facts": [
                { "name": "Application", "value": "{{.app.metadata.name}}" },
                { "name": "Health Status", "value": "Degraded ⚠️ (Check Pods/Events)" },
                { "name": "Message", "value": "{{.app.status.health.message}}" }
              ],
              "markdown": true
            }],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Open ArgoCD",
                "targets": [{ "os": "default", "uri": "https://localhost:8080/applications/{{.app.metadata.name}}" }]
              }
            ]
          }
