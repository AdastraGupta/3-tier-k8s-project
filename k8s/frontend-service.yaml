apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: frontend
spec:
  # ClusterIP: traffic reaches frontend only via the nginx Ingress Controller.
  # The Ingress Controller has its own AWS ELB — no need for a second one here.
  type: ClusterIP
  selector:
    app: taskmanager
    tier: frontend
  ports:
    - name: http-web
      port: 80
      targetPort: 80
      protocol: TCP
