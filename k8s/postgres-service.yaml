apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: database
# ── AWS EKS (Production) ───────────────────────────────────────────────────
# ExternalName service that routes postgres-svc:5432 traffic to the
# AWS RDS PostgreSQL instance. Update externalName after 'terraform apply'
# using: terraform output rds_address
spec:
  type: ExternalName
  externalName: taskmanager-cluster-postgres.cihucisyi0nw.us-east-1.rds.amazonaws.com
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
