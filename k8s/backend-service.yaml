apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: taskmanager
    tier: backend
  ports:
    - name: http-api        # Istio protocol hint: treat as HTTP (enables L7 features)
      port: 3000
      targetPort: 3000
      protocol: TCP
