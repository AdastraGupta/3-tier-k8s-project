apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-config
  namespace: taskmanager
  labels:
    app: taskmanager
data:
  init.sql: |
    -- Create api schema for PostgREST
    CREATE SCHEMA IF NOT EXISTS api;

    -- Create tasks table in api schema
    CREATE TABLE IF NOT EXISTS api.tasks (
      id SERIAL PRIMARY KEY,
      title TEXT NOT NULL,
      description TEXT DEFAULT '',
      status TEXT NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'in_progress', 'completed')),
      priority TEXT NOT NULL DEFAULT 'medium' CHECK (priority IN ('low', 'medium', 'high')),
      created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
      updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Create read-only role for PostgREST anonymous access
    CREATE ROLE web_anon NOLOGIN;
    GRANT USAGE ON SCHEMA api TO web_anon;
    GRANT SELECT, INSERT, UPDATE, DELETE ON api.tasks TO web_anon;
    GRANT USAGE, SELECT ON SEQUENCE api.tasks_id_seq TO web_anon;

    -- Seed sample data
    INSERT INTO api.tasks (title, description, status, priority) VALUES
      ('Set up Kubernetes cluster', 'Install minikube or kind for local K8s development', 'completed', 'high'),
      ('Deploy PostgreSQL', 'Create PVC and deploy PostgreSQL with init scripts', 'completed', 'high'),
      ('Configure PostgREST API', 'Set up PostgREST to auto-generate REST API from DB schema', 'in_progress', 'high'),
      ('Build Frontend UI', 'Create Nginx-served task manager interface', 'in_progress', 'medium'),
      ('Set up Ingress routing', 'Configure path-based routing for frontend and API', 'pending', 'medium'),
      ('Add monitoring', 'Integrate Prometheus and Grafana for observability', 'pending', 'low'),
      ('Write documentation', 'Create comprehensive README with deployment instructions', 'pending', 'low');
