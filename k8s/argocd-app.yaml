apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskmanager
  namespace: argocd
  labels:
    app: taskmanager
  # Finalizer ensures ArgoCD deletes all managed resources when this Application is deleted
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # ─── Source ─────────────────────────────────────────────────────────────────
  # ArgoCD watches this Git repo path for changes and auto-syncs
  source:
    repoURL: https://github.com/AdastraGupta/3-tier-k8s-project.git
    targetRevision: main
    path: k8s
    directory:
      exclude: "argocd-*.yaml"   # Prevent ArgoCD from managing its own manifests

  # ─── Destination ────────────────────────────────────────────────────────────
  destination:
    server: https://kubernetes.default.svc
    namespace: taskmanager

  # ─── Sync Policy ────────────────────────────────────────────────────────────
  syncPolicy:
    automated:
      selfHeal: true    # Revert any manual kubectl changes to match Git
      prune: true       # Delete resources that are removed from Git
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
