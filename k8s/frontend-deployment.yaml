apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskmanager
      tier: frontend
  template:
    metadata:
      labels:
        app: taskmanager
        tier: frontend
      annotations:
        prometheus.io/scrape: "false"   # nginx has no /metrics endpoint
    spec:
      serviceAccountName: frontend-sa
      # Pin frontend pods to the application node group (SPOT instances)
      nodeSelector:
        nodegroup: app
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: frontend-config-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: frontend-config-volume
          configMap:
            name: frontend-config
            items:
              - key: nginx.conf
                path: nginx.conf
              - key: index.html
                path: index.html
