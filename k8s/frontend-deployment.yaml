apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskmanager
      tier: frontend
  template:
    metadata:
      labels:
        app: taskmanager
        tier: frontend
      annotations:
        # CloudWatch Agent discovers and scrapes this pod's Prometheus metrics endpoint.
        # Metrics are sent to CloudWatch Logs (EMF) → ContainerInsights/Prometheus namespace.
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: frontend-sa  # Istio SPIFFE identity: cluster.local/ns/taskmanager/sa/frontend-sa
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: frontend-config-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: frontend-config-volume
          configMap:
            name: frontend-config
            items:
              - key: nginx.conf
                path: nginx.conf
              - key: index.html
                path: index.html
