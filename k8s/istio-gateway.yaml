# ─── Istio Traffic Management — Task Manager (PROD / AWS EKS) ─────────────────
#
# This file defines three Istio resources that replace the Nginx Ingress in PROD:
#
#   Gateway          — Binds the Istio IngressGateway pod to port 80 (HTTP)
#   VirtualService   — Routes incoming requests to the correct backend service:
#                        /api/* → backend-svc:3000  (PostgREST API)
#                        /      → frontend-svc:80   (Nginx static app)
#   DestinationRule  — Configures connection pool and outlier detection for backend
#
# The Nginx Ingress (k8s/ingress.yaml) is superseded by these resources in PROD.
# ────────────────────────────────────────────────────────────────────────────────

# ── Gateway ───────────────────────────────────────────────────────────────────
# Configures the Istio IngressGateway pod (running in istio-system) to accept
# inbound HTTP traffic on port 80 for any hostname.
# The "istio: ingressgateway" selector targets the pod deployed by the Helm chart.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: taskmanager-gateway
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  selector:
    istio: ingressgateway   # Selects the IngressGateway pod in istio-system
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"   # Accept all hostnames; restrict to a FQDN in PROD (e.g. app.example.com)

---
# ── VirtualService ────────────────────────────────────────────────────────────
# Defines HTTP routing rules applied by the Envoy proxies.
# Traffic arriving at the IngressGateway is matched by URI prefix and forwarded
# to the appropriate ClusterIP service inside the taskmanager namespace.
#
# Route priority: more specific prefixes (/api) are listed before the catch-all (/).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: taskmanager-routes
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  hosts:
    - "*"
  gateways:
    - taskmanager-gateway
  http:
    # ── /api route → PostgREST backend ─────────────────────────────────────────
    - name: backend-route
      match:
        - uri:
            prefix: /api
      rewrite:
        uri: /            # Strip the /api prefix — PostgREST serves at root
      route:
        - destination:
            host: backend-svc
            port:
              number: 3000
      # Resilience: retry up to 3 times on connect-failure or 5xx responses
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: connect-failure,refused-stream,5xx
      # Global timeout for the API route
      timeout: 30s

    # ── / route → Nginx frontend ────────────────────────────────────────────────
    - name: frontend-route
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-svc
            port:
              number: 80
      # Frontend serves static assets; a generous timeout is fine
      timeout: 30s

---
# ── DestinationRule (backend) ─────────────────────────────────────────────────
# Applies connection-pool limits and outlier detection (circuit breaking) to
# the backend PostgREST deployment. Outlier detection automatically ejects pods
# that return consecutive errors, preventing request storms to unhealthy replicas.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend-destination-rule
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  host: backend-svc
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        idleTimeout: 90s
    outlierDetection:
      consecutive5xxErrors: 5         # Eject pod after 5 consecutive 5xx responses
      interval: 30s                   # Scan interval
      baseEjectionTime: 30s           # Minimum ejection duration
      maxEjectionPercent: 50          # Never eject more than 50% of the pool
      minHealthPercent: 50            # Keep at least 50% of backends healthy

---
# ── DestinationRule (frontend) ────────────────────────────────────────────────
# Applies connection pool limits for the Nginx frontend service.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: frontend-destination-rule
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  host: frontend-svc
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 200
        http2MaxRequests: 2000
        idleTimeout: 90s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
