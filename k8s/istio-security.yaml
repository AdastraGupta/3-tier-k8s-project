# ─── Istio Security — Zero Trust mTLS (PROD / AWS EKS) ────────────────────────
#
# This file enforces Zero Trust security for the Task Manager namespace:
#
#   PeerAuthentication   — Enforces STRICT mTLS for ALL services in taskmanager.
#                          Plain-text traffic between pods is rejected.
#
#   AuthorizationPolicy  — Fine-grained per-service access control:
#     · frontend   → only reachable from Istio IngressGateway
#     · backend    → only reachable from Istio IngressGateway + frontend pods
#     · postgres   → only reachable from backend pods (blocks all other sources)
#
# ServiceAccounts are used as the identity source for AuthorizationPolicies.
# Each Deployment/StatefulSet is associated with its own named ServiceAccount
# so that mTLS certificate Subject Alternative Names (SANs) can be matched.
# ────────────────────────────────────────────────────────────────────────────────

# ─── ServiceAccounts ──────────────────────────────────────────────────────────
# Dedicated ServiceAccounts give each workload a unique SPIFFE identity
# (spiffe://cluster.local/ns/taskmanager/sa/<name>) used by Istio mTLS and
# referenced in AuthorizationPolicy rules below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: frontend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: backend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: taskmanager
  labels:
    app: taskmanager
    tier: database

---
# ─── PeerAuthentication — Namespace-Wide STRICT mTLS ─────────────────────────
# Applies to the entire taskmanager namespace.
# STRICT mode: Envoy sidecars MUST present a valid mTLS certificate.
# Any pod without a sidecar (or one not in the mesh) will be rejected.
# This means all frontend ↔ backend ↔ postgres traffic is encrypted and mutually
# authenticated automatically — no application code changes needed.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: taskmanager-mtls
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  mtls:
    mode: STRICT

---
# ─── AuthorizationPolicy — Frontend ──────────────────────────────────────────
# The frontend (Nginx) should only receive traffic from the Istio IngressGateway.
# This blocks direct pod-to-pod access to the frontend from any other workload.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: frontend-authz
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  selector:
    matchLabels:
      tier: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            # Istio IngressGateway's SPIFFE identity
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            ports: ["80"]
            methods: ["GET", "HEAD", "OPTIONS"]

---
# ─── AuthorizationPolicy — Backend (PostgREST API) ───────────────────────────
# The backend should only receive traffic from:
#   1. Istio IngressGateway (for /api requests routed directly by VirtualService)
#   2. frontend-sa (if frontend pods ever need server-side proxying — defense-in-depth)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: backend-authz
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  selector:
    matchLabels:
      tier: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # IngressGateway forwards /api requests directly
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              # Frontend pods (defense-in-depth; not used in current architecture)
              - "cluster.local/ns/taskmanager/sa/frontend-sa"
      to:
        - operation:
            ports: ["3000"]

---
# ─── AuthorizationPolicy — PostgreSQL ────────────────────────────────────────
# The most critical policy: ONLY the backend (PostgREST) ServiceAccount may
# open connections to the database on port 5432. All other sources are denied.
# This ensures a compromised frontend or any other workload cannot reach the DB.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: postgres-authz
  namespace: taskmanager
  labels:
    app: taskmanager
spec:
  selector:
    matchLabels:
      tier: database
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # Only backend pods (PostgREST) may connect to port 5432
              - "cluster.local/ns/taskmanager/sa/backend-sa"
      to:
        - operation:
            ports: ["5432"]
